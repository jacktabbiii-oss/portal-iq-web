  tier2:
    - Big 12
    - ACC

  tier3:
    - American
    - Mountain West
    - Sun Belt
    - MAC
    - CUSA

# NIL Tier Thresholds (in USD)
nil_tiers:
  mega: 1000000
  premium: 500000
  solid: 100000
  moderate: 25000
  entry: 0

# Model Hyperparameters
model_params:
  nil_valuator:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    min_child_weight: 3
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0

  portal_predictor:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    min_child_weight: 3
    subsample: 0.8
    colsample_bytree: 0.8

  draft_projector:
    n_estimators: 150
    max_depth: 8
    learning_rate: 0.05
    min_child_weight: 5
    subsample: 0.7
    colsample_bytree: 0.7

  win_model:
    n_estimators: 100
    max_depth: 5
    learning_rate: 0.1
    min_child_weight: 10
    subsample: 0.9

# API Keys (loaded from environment variables)
api_keys:
  cfbd: ${CFBD_API_KEY}
  database: ${DATABASE_URL}

# Logging Configuration
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Cache Settings
cache:
  enabled: true
  ttl_hours: 24
  max_size_mb: 500
